<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readiness · Marketing</title>
<!-- ORDER #3949: the marketing readiness board. Exec only. Rebuilt from live reads
     every time it is opened (GET /api/readiness); no dated snapshot. Read only. -->
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg.css">
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg-tokens.css">
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg-components.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  .wrap { display: grid; gap: 20px; padding-block: 24px 48px; max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
  .top { font-size: 20px; font-weight: 600; }
  .muted { font-size: 12px; color: #6d6e71; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid #eceef2; font-size: 14px; }
  th { font-size: 12px; color: #6d6e71; font-weight: 600; }
  .pill { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 6px; font-weight: 600; }
  .green { background: #e8f5ee; color: #1d6b42; }
  .red { background: #fdecea; color: #b42318; }
  .na { background: #f4f5f7; color: #6d6e71; }
  .line { display: block; margin-top: 4px; color: #3b3c3e; }
  ol li { margin-bottom: 6px; font-size: 14px; }
</style>
</head>
<body>
<main class="wrap">
  <div>
    <div class="top" id="top">Loading the board...</div>
    <div class="muted" id="when"></div>
  </div>
  <section>
    <h2>What still blocks relaunch, shortest fix first</h2>
    <ol id="blockers"></ol>
  </section>
  <section>
    <h2>Team</h2>
    <table><thead><tr><th>Row</th><th>State</th></tr></thead><tbody id="team"></tbody></table>
  </section>
  <section>
    <h2>Agents</h2>
    <table><thead><tr><th>Agent</th><th>Connected</th><th>Acts</th><th>Proven</th></tr></thead><tbody id="agents"></tbody></table>
  </section>
</main>
<script>
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const WORD = { green: 'Green', red: 'Red', na: 'n/a' };
  function cell(c) {
    if (!c) return '';
    const who = c.state === 'red' && c.owner ? ` (${esc(c.owner)})` : '';
    const link = c.link ? ` <a href="${esc(c.link)}" target="_blank" rel="noopener">evidence</a>` : '';
    return `<span class="pill ${esc(c.state)}">${WORD[c.state] || esc(c.state)}</span><span class="line">${esc(c.line)}${who}${link}</span>`;
  }
  fetch('/api/readiness', { credentials: 'same-origin' }).then((r) => r.json().then((b) => ({ ok: r.ok, b }))).then(({ ok, b }) => {
    if (!ok) { document.getElementById('top').textContent = b.error || 'Could not load the board.'; return; }
    document.getElementById('top').textContent = b.top_line;
    document.getElementById('when').textContent = `Read live ${new Date().toLocaleString('en-US', { timeZone: 'America/Chicago' })} CT. ${b.hold && b.hold.hold ? 'The card hold is on.' : 'The card hold is off.'}`;
    document.getElementById('blockers').innerHTML = b.blockers.map((x) => `<li><strong>${esc(x.where)}</strong>, ${esc(x.check)}: ${esc(x.line)} <span class="muted">(${esc(x.owner)}, about ${x.minutes} min)</span></li>`).join('') || '<li>Nothing. Relaunch is Mimi\'s yes or no.</li>';
    document.getElementById('team').innerHTML = b.team.map((t) => `<tr><td>${esc(t.label)}</td><td>${cell(t)}</td></tr>`).join('');
    document.getElementById('agents').innerHTML = b.agents.map((a) => `<tr><td><strong>${esc(a.name)}</strong><div class="muted">${a.ready ? 'ready' : 'not ready'}</div></td><td>${cell(a.connected)}</td><td>${cell(a.acts)}</td><td>${cell(a.proven)}</td></tr>`).join('');
  }).catch(() => { document.getElementById('top').textContent = 'Could not load the board.'; });
</script>
</body>
</html>
