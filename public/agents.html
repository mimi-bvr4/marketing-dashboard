<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katherine's Team · Marketing</title>
<!-- ORDER #1658: the Agents page. Katherine edits what each marketing bot does;
     every save is a new version the Box's next run uses. The fence (drafts only,
     nothing published, sent or spent, the AI-tells lint) is added by the runner
     and cannot be edited here. Token layer served by dispatch (#1210).
     ORDER #1664: the roster. Each agent is a character card with a portrait and
     a name Katherine sets; names and portraits are cosmetic and save at once.
     Open a character (#slug) for everything #1658 had: asks, instructions,
     versions, Run now with a request. -->
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg.css">
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg-tokens.css">
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg-components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --cream: #F7F4EF; --ink: #211E1B; --muted: #5a534c; --line: #E4DDD3; --terra: #BD574E; --rust: #8A4832; }
  body { background: var(--cream); }
  .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
  .wrap { display: grid; gap: 24px; padding-block: 28px 56px; color: var(--ink); }
  /* #2941 one title: the band is the page title; one short line and the status pills share a row. */
  .intro { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
  .intro p { margin: 0; max-width: 680px; color: var(--muted); font-size: 15px; line-height: 1.45; flex: 1 1 18rem; min-width: 0; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .s-ok { background: #E3EFE8; color: #1F5A3F; } .s-part { background: #F7EBD3; color: #7A4E0E; } .s-wait { background: #F5E1DE; color: #8A2B22; } .s-off { background: #E7E3DD; color: #4D453D; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .who { display: flex; gap: 14px; align-items: center; }
  .face { flex: 0 0 auto; border-radius: 50%; overflow: hidden; display: block; }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .role { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--rust); }
  .name { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(19px, 5.4vw, 24px); color: var(--ink); border: 1px dashed transparent; border-radius: 6px; padding: 2px 4px; margin-left: -5px; background: transparent; width: 100%; box-sizing: border-box; min-width: 0; }
  .name:hover { border-color: var(--line); }
  .name:focus { outline: 2px solid var(--terra); outline-offset: 2px; }
  .job { font-size: 14px; color: var(--muted); }
  .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .does { margin: 0; font-size: 15px; line-height: 1.5; }
  .need { background: #FBF7F1; border: 1px solid #EFE6D8; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
  .btn.primary { border: none; background: var(--terra); color: #fff; }
  .btn.ghost { border: 1px solid #D8CFC2; background: #fff; color: var(--ink); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .msg { font-size: 13px; margin: 0; } .ok { color: #1d6b42; } .err { color: #b42318; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }
  /* one character */
  .back { font-weight: 600; text-decoration: none; color: var(--rust); }
  .hero { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
  .hero .pic { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 0 0 210px; }
  .hero .name { font-size: clamp(30px, 5vw, 42px); border-color: var(--line); }
  .hero .info { flex: 1 1 380px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .up { position: relative; }
  .up input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .up:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 10px; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .panel h2 { margin: 0; font-size: 21px; }
  .panel ul { margin: 0; padding-left: 1.1rem; font-size: 15px; line-height: 1.5; }
  .rule { border-left: 3px solid var(--terra); padding-left: 12px; font-size: 15px; }
  .rule .instead { color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row input[type=text] { flex: 1 1 16rem; min-height: 44px; font: inherit; border: 1px solid #D8CFC2; border-radius: 10px; padding: 0 10px; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; border: 1px solid #D8CFC2; border-radius: 10px; padding: 10px; }
  textarea.code { min-height: 22rem; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  .asks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 14px; }
  .asks li { border-left: 3px solid var(--line); padding-left: 10px; }
  .st-applied, .st-built { border-left-color: #1d6b42 !important; }
  .st-cant, .st-declined, .st-failed { border-left-color: #b42318 !important; }
  .st-awaiting_exec, .st-building, .st-new, .st-sorting { border-left-color: #8a5300 !important; }
  pre.proposed { white-space: pre-wrap; font-size: 12px; max-height: 20rem; overflow: auto; background: #f4f5f7; padding: 8px; }
  details > summary { cursor: pointer; font-weight: 600; }
  .tbl { overflow-x: auto; }
  table.hist { border-collapse: collapse; font-size: 13px; width: 100%; }
  table.hist td, table.hist th { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
  .meta { font-size: 13px; color: var(--muted); }
  /* #2900 the Producer */
  .producer { background: #fff; border: 2px solid var(--terra); border-radius: 16px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
  /* #2941 the Producer at normal size: one summary row, the week behind a toggle. */
  .psum { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .psum .who { flex: 1 1 280px; min-width: 0; }
  .psum .pills { flex: 1 1 320px; }
  .pweek { display: grid; gap: 16px; min-width: 0; }
  .pweek[hidden] { display: none; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 720px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .day { background: #FBF7F1; border: 1px dashed #E4D8C6; border-radius: 12px; padding: 8px; min-height: 84px; display: flex; flex-direction: column; gap: 6px; }
  .day.over { border-color: var(--terra); background: #F8E9E6; }
  .day h3 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--rust); }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .chip[draggable=true] { cursor: grab; }
  .chip select { font: inherit; font-size: 12px; min-height: 28px; }
  .boardl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .boardl li { border-left: 3px solid var(--line); padding-left: 10px; }
  .b-waiting, .b-failed { border-left-color: #b42318 !important; } .b-held { border-left-color: #8a5300 !important; }
  .b-ran { border-left-color: #1d6b42 !important; } .b-paused { border-left-color: #8B8178 !important; }
  .speak { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: inherit; cursor: pointer; padding: 0; margin-top: 4px; }
  .speak:hover, .speak.playing { background: #F4EFE8; }
  .speakcap { display: block; font-size: 13px; font-style: italic; color: #5b534b; margin-top: 4px; max-width: 32ch; }
</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner">
  <div class="wordmark"><span class="brand-mark" aria-hidden="true"></span>Katherine's Team</div>
  <nav><a href="/">Dashboard</a> · <a href="/review">Review</a> · <a href="/photos">Photos</a></nav>
</div></header>
<main class="container wrap" id="main"><p class="meta">Loading…</p></main>
<script src="/agents-view.js"></script>
<script>
(function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (d) => d ? new Date(d).toLocaleString('en-US', { timeZone: 'America/Chicago', month: '2-digit', day: '2-digit', year: 'numeric', hour: 'numeric', minute: '2-digit' }).replace(/\//g, '.') : '';
  async function api(url, opt) {
    const r = await fetch(url, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt || {}));
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('error ' + r.status));
    return j;
  }
  const main = document.getElementById('main');
  let agents = [];
  let exec = false;

  // The drawn portrait each character has until someone uploads one.
  const LOOK = {
    'bloggy-bob': ['#F3DED8', '#8A4832', 'M2 20h4L17 9l-4-4L2 16v4z M11 7l4 4'],
    'site-health': ['#DCE6E4', '#2F5D5A', 'M9 3a6 6 0 1 0 0 12 6 6 0 0 0 0-12z M14 14l5 5'],
    'monthly-report': ['#E1E0EE', '#46407A', 'M3 20V11 M9 20V5 M15 20v-6 M2 20h19'],
    'citations': ['#DDE8DF', '#2F5D3F', 'M11 2l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V5l7-3z M8 11l2 2 4-4'],
    'gbp': ['#F2E0DC', '#8A2B22', 'M4 17h14 M6 17v-3a5 5 0 0 1 10 0v3 M11 7v2 M9 5h4'],
    'paid-ads': ['#E7E3DD', '#4D453D', 'M8 3h6v3H8z M6 4H4v16h14V4h-2 M7 11h8 M7 15h5'],
    'seo': ['#E6EEDC', '#4A6A2A', 'M3 18l5-6 4 3 6-8 M14 7h4v4'],
    'pr-patty': ['#F1E3EC', '#7A3A62', 'M3 10v4h3l6 4V6L6 10H3z M15 9a4 4 0 0 1 0 6 M17 6a8 8 0 0 1 0 12'],
    'copywriter': ['#EEE6D6', '#6B5426', 'M4 20h4l10-10-4-4L4 16v4z M3 4h8 M3 8h5'],
    'email': ['#E0EAEC', '#2F5D66', 'M3 6h18v12H3z M3 6l9 7 9-7'],
    'convention-connector': ['#DDE3EE', '#34466B', 'M3 20V9l8-5 8 5v11 M8 20v-6h6v6 M3 9h16'],
    'pinterest-paul': ['#F4DCDC', '#9A2A2A', 'M11 2a7 7 0 0 0-2.5 13.5L7 21 M11 2a7 7 0 0 1 0 14 M9 9a2 2 0 1 1 4 0c0 2-2 2-2 4'],
    'scout': ['#E2E6EE', '#3B4A66', 'M2 15a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M12 15a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M10 15h2 M4 11l2-6h3l1 6 M18 11l-2-6h-3l-1 6'],
  };
  function face(a, size) {
    const label = `Portrait of ${a.name}`;
    if (a.portrait) return `<span class="face" style="width:${size}px;height:${size}px"><img src="${esc(a.portrait)}" alt="${esc(label)}" width="${size}" height="${size}"></span>`;
    const [tint, ink, icon] = LOOK[a.slug] || ['#E7E3DD', '#4D453D', 'M6 12h10 M11 7v10'];
    return `<svg class="face" width="${size}" height="${size}" viewBox="0 0 88 88" role="img" aria-label="${esc(label)}">
      <circle cx="44" cy="44" r="44" fill="${tint}"/><path d="M18 78c2-14 12-22 26-22s24 8 26 22" fill="${ink}"/><circle cx="44" cy="34" r="14" fill="${ink}"/>
      <circle cx="69" cy="67" r="17" fill="#fff" stroke="${ink}" stroke-width="2"/>
      <g transform="translate(57 55)"><path d="${icon}" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
  }
  // Status from facts the page already has; never a guess.
  function status(a) {
    const on = a.current ? a.current.enabled : true;
    if (!on) return { cls: 's-off', label: 'Paused' };
    if (a.paused) return { cls: 's-off', label: 'Paused' }; // #2903: Paid Ads, until its source exists
    if (a.card_only && !a.ask_page) return { cls: 's-part', label: 'Not running yet' }; // #2903: Site Guardian
    if (a.sources.some((s) => s.required && s.pending)) return { cls: 's-wait', label: 'Waiting on input' };
    if (a.last_run && a.last_run.status === 'failed') return { cls: 's-wait', label: 'Last run failed' };
    if (a.sources.some((s) => s.pending) || (a.last_run && (a.last_run.unavailable || []).length)) return { cls: 's-part', label: 'Partly working' };
    return { cls: 's-ok', label: 'Working' };
  }
  // #2941 the eyebrow rule (public/agents-view.js): the role shows only when the name differs from it.
  const V = window.AgentsView;
  const eyebrow = (key, role, name) => `<span class="role" data-role-for="${esc(key)}" data-role="${esc(role)}" ${V.showEyebrow(role, name) ? '' : 'hidden'}>${esc(role)}</span>`;
  function syncEyebrow(key, name) {
    const r = main.querySelector(`[data-role-for="${key}"]`); if (r) r.hidden = !V.showEyebrow(r.dataset.role, name);
  }
  const nameInput = (a, cls) => `<input class="name ${cls || ''}" data-name="${a.slug}" value="${esc(a.name)}" maxlength="40" aria-label="Name for ${esc(a.character.role)}" title="Click to rename">`;

  function cardHtml(a) {
    const st = status(a);
    const need = a.character.needs[0];
    return `<article class="card" data-slug="${a.slug}">
      <div class="who">${face(a, 84)}<div class="txt">${eyebrow(a.slug, a.character.role, a.name)}${nameInput(a)}<span class="job">${esc(a.job)}</span>${V.speakerHtml(voices, a.slug, a.name, esc)}</div></div>
      <div class="line"><span class="pill ${st.cls}">${st.label}</span><span>${esc(a.cadence)}</span></div>
      <p class="does">${esc(a.character.does[0] || '')}</p>
      ${need ? `<div class="need"><strong>Waiting on:</strong> ${esc(need)}${a.character.needs.length > 1 ? ` (+${a.character.needs.length - 1} more)` : ''}</div>` : ''}
      ${a.paused ? `<div class="need"><strong>Paused:</strong> ${esc(a.paused)}</div>` : ''}
      <div class="acts">${a.ask_page ? `<a class="btn primary" href="${esc(a.ask_page)}">Ask ${esc(a.name)}</a>` : a.card_only ? `<span class="meta">${esc(a.card_only)}</span>` : `<button class="btn primary" data-a="run" ${a.waiting ? 'disabled' : ''}>${a.waiting ? 'Run waiting' : 'Run now'}</button>`}<a class="btn ghost" href="#${a.slug}">Open profile</a></div>
      <p class="msg" hidden></p>
    </article>`;
  }
  // The "say something" button: off unless the switch is on (GET /api/agent-voices).
  // Plays only on a click, one clip at a time, never loops; the line shows as a
  // caption while it plays.
  let voices = { on: false };
  const lastClip = {};
  let player = null;
  main.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-speak]'); if (!b) return;
    const slug = b.dataset.speak; const clips = V.speakerFor(voices, slug); if (!clips) return;
    if (player) { player.pause(); player = null; main.querySelectorAll('.speak.playing').forEach((x) => x.classList.remove('playing')); main.querySelectorAll('[data-speakcap]').forEach((x) => { x.hidden = true; }); }
    const i = V.pickClip(clips.length, lastClip[slug]); lastClip[slug] = i;
    const cap = main.querySelector(`[data-speakcap="${slug}"]`);
    const a = new Audio(clips[i].src); a.loop = false; player = a;
    const done = () => { b.classList.remove('playing'); if (cap) cap.hidden = true; if (player === a) player = null; };
    a.addEventListener('ended', done); a.addEventListener('error', done);
    b.classList.add('playing'); if (cap) { cap.textContent = clips[i].line; cap.hidden = false; }
    a.play().catch(done);
  });
  // #2900 the Producer: the week, the brakes and the board. It never writes,
  // approves or sends anything; moving a day is a schedule change she may make.
  let producer = null;
  let producerOpen = false; // survives the re-render after a day is moved
  main.addEventListener('click', (e) => {
    const t = e.target.closest('button[data-pweek]'); if (!t) return;
    producerOpen = !producerOpen;
    const w = main.querySelector('#pweek'); if (w) w.hidden = !producerOpen;
    t.setAttribute('aria-expanded', String(producerOpen)); t.textContent = producerOpen ? 'Hide the week' : 'Show the week';
  });
  const WEEK = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
  function producerHtml() {
    const p = producer; if (!p) return '';
    const weekly = p.calendar.filter((e) => e.movable);
    const daily = p.calendar.filter((e) => e.days && e.days.includes('daily')).map((e) => e.name);
    const monthly = p.calendar.filter((e) => e.month_days).map((e) => `${e.name} (the ${e.month_days.join(', ')})`);
    const chip = (e, d) => `<div class="chip" draggable="true" data-move="${e.agent}" data-from="${d}"><strong>${esc(e.name)}</strong>
      <select data-movesel="${e.agent}" data-from="${d}" aria-label="Move ${esc(e.name)} to another day">${WEEK.map(([k, l]) => `<option value="${k}" ${k === d ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
    const stuck = V.stuckCount(p.board);
    // #2941: collapsed to one summary row by default; "Show the week" opens the calendar and the stuck list.
    return `<section class="producer" data-slug="producer">
      <div class="psum">
        <div class="who">${face({ slug: 'producer', name: p.name }, 84)}<div class="txt">${eyebrow('producer', 'The producer', p.name)}
          <input class="name" data-pname value="${esc(p.name)}" maxlength="40" aria-label="Name for the producer" title="Click to rename">
          <span class="job">Runs the team's week. It never writes, approves or sends anything.</span>${V.speakerHtml(voices, 'producer', p.name, esc)}</div></div>
        <div class="pills"><span class="pill ${p.waiting >= p.hold_at ? 's-wait' : 's-ok'}">${p.waiting} drafts waiting (holds at ${p.hold_at})</span>
          <span class="pill ${p.week_cards >= p.cap ? 's-wait' : 's-ok'}">${p.week_cards} of ${p.cap} cards this week</span>
          <span class="pill ${p.on ? 's-ok' : 's-off'}">${p.on ? 'Running the week' : 'Not switched on yet'}</span>
          <span class="pill ${stuck ? 's-wait' : 's-ok'}" data-stuck>${stuck ? `${stuck} stuck` : 'No one stuck'}</span></div>
        <button type="button" class="btn ghost" data-pweek aria-expanded="${producerOpen}" aria-controls="pweek">${producerOpen ? 'Hide the week' : 'Show the week'}</button>
      </div>
      <div class="pweek" id="pweek" ${producerOpen ? '' : 'hidden'}>
      ${p.on ? '' : '<p class="note">Not switched on yet: the old schedule still runs. The week below is the proposed one, and your moves are kept for the day it starts.</p>'}
      <div><p class="meta" style="margin:0 0 6px">Every day: ${esc(daily.join(', '))}. Monthly: ${esc(monthly.join(', '))}. Drag a name to another day, or pick the day under it.</p>
        <div class="week">${WEEK.map(([k, l]) => `<div class="day" data-day="${k}"><h3>${l}</h3>${weekly.filter((e) => e.days.includes(k)).map((e) => chip(e, k)).join('')}</div>`).join('')}</div></div>
      <div><h2 class="serif" style="margin:0 0 6px;font-size:21px">Who is stuck</h2>
        <ul class="boardl">${p.board.map((b) => `<li class="b-${b.state}"><strong>${esc(b.name)}</strong>: ${esc(b.line)}</li>`).join('')}</ul></div>
      ${p.health ? `<div><h2 class="serif" style="margin:0 0 6px;font-size:21px">This morning's check</h2>
        <p class="meta" style="margin:0 0 6px">${esc(p.health.line)}</p>
        ${p.health.alerts.length ? `<ul class="boardl">${p.health.alerts.map((a) => `<li class="b-held">${esc(a.line)}</li>`).join('')}</ul>` : ''}</div>` : ''}
      <p class="note">${esc(p.exempt.length ? 'Never held by the brakes: the press requests and the review replies.' : '')} When ${p.hold_at} or more drafts wait, the other scheduled runs wait too, and the board says so.</p>
      </div>
      <p class="msg" hidden></p>
    </section>`;
  }
  async function moveDay(agent, from, to, el) {
    if (!to || to === from) return;
    const e = producer.calendar.find((x) => x.agent === agent);
    const days = [...new Set(e.days.filter((d) => d !== from).concat(to))];
    try { await api(`/api/producer/calendar/${agent}`, { method: 'POST', body: JSON.stringify({ days }) }); await load(); say(main.querySelector('.producer') || main, `Moved. ${e.name} now runs ${days.map((d) => (WEEK.find((w) => w[0] === d) || [d, d])[1]).join(', ')}.`, true); }
    catch (x) { say(el, x.message); }
  }
  main.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('[data-move]'); if (c) e.dataTransfer.setData('text/plain', `${c.dataset.move}|${c.dataset.from}`); });
  main.addEventListener('dragover', (e) => { const d = e.target.closest && e.target.closest('.day'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  main.addEventListener('dragleave', (e) => { const d = e.target.closest && e.target.closest('.day'); if (d) d.classList.remove('over'); });
  main.addEventListener('drop', (e) => {
    const d = e.target.closest && e.target.closest('.day'); if (!d) return; e.preventDefault(); d.classList.remove('over');
    const [agent, from] = String(e.dataTransfer.getData('text/plain')).split('|'); if (agent) moveDay(agent, from, d.dataset.day, d);
  });
  function rosterHtml() {
    const c = { ok: 0, part: 0, wait: 0 };
    agents.forEach((a) => { const s = status(a).cls; if (s === 's-ok') c.ok++; else if (s === 's-part') c.part++; else c.wait++; });
    // #2941: the band above is the page title; no second heading here.
    return `<div class="intro"><p>${agents.length} AI team members. Every piece of work lands in <a href="/review">Review</a> as a draft; nothing goes out on its own.</p>
      <div class="pills"><span class="pill s-ok">${c.ok} working</span><span class="pill s-part">${c.part} partly working</span><span class="pill s-wait">${c.wait} waiting or paused</span></div></div>
      ${questionHtml()}
      ${producerHtml()}
      <div class="grid">${agents.map(cardHtml).join('')}</div>
      <p class="note">Click a name to rename someone; open a profile to change what they do. A name or portrait shows everywhere that team member appears (Review cards, the Monday digest) and saves at once. It changes nothing about what they are allowed to do.</p>`;
  }

  // #2915: ask a question about the team's own cards and runs. Read only; the
  // answer names the cards it used, each a link to it on Review.
  let lastAnswer = null;
  function answerHtml(r) {
    if (!r) return '';
    const cards = (r.cards || []).length ? `<ul class="asks">${r.cards.map((c) => `<li><a href="${esc(c.link)}">${esc(c.title)}</a> <span class="meta">${esc(c.member)} · ${esc(c.status)} · ${fmt(c.decided_at || c.created_at)}</span></li>`).join('')}</ul>${r.more ? `<p class="meta">and ${r.more} more on <a href="/review">Review</a>.</p>` : ''}` : '';
    const runs = (r.runs || []).length ? `<ul class="asks">${r.runs.map((x) => `<li>${fmt(x.started_at)} <span class="meta">${esc(x.status)} · ${x.cards} card${x.cards === 1 ? '' : 's'}</span></li>`).join('')}</ul>` : '';
    const can = r.can_answer ? `<ul class="asks">${r.can_answer.map((x) => `<li><button type="button" class="btn ghost" style="min-height:32px;font-size:13px" data-teamq-try="${esc(x)}">${esc(x)}</button></li>`).join('')}</ul>` : '';
    return `<p class="msg ${r.understood ? 'ok' : 'err'}" style="display:block">${esc(r.answer)}</p>${cards}${runs}${can}`;
  }
  function questionHtml() {
    return `<section class="panel" data-teamq-panel><h2 class="serif">Ask about your team</h2>
      <p class="meta" style="margin:0">Answers come only from your team's own cards and runs. Nothing is changed by asking.</p>
      <form class="row" data-teamq><input type="text" name="q" maxlength="300" placeholder="e.g. how many drafts are waiting" aria-label="Your question">
        <button class="btn primary" type="submit">Ask</button></form>
      <div data-teamq-out>${answerHtml(lastAnswer)}</div></section>`;
  }
  async function askTeam(question, panel) {
    const out = panel.querySelector('[data-teamq-out]');
    out.innerHTML = '<p class="meta">Looking…</p>';
    try { lastAnswer = await api('/api/team/question', { method: 'POST', body: JSON.stringify({ question }) }); out.innerHTML = answerHtml(lastAnswer); }
    catch (x) { out.innerHTML = `<p class="err">${esc(x.message)}</p>`; }
  }
  main.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-teamq]'); if (!f) return;
    e.preventDefault(); askTeam(f.q.value, f.closest('[data-teamq-panel]'));
  });
  main.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-teamq-try]'); if (!b) return;
    const p = b.closest('[data-teamq-panel]'); p.querySelector('form[data-teamq]').q.value = b.dataset.teamqTry; askTeam(b.dataset.teamqTry, p);
  });

  const STATUS = { new: 'Waiting for the Box to sort it', sorting: 'Being sorted', awaiting_exec: 'Instruction change proposed, waiting for Mimi',
    applied: 'Added', declined: 'Declined', building: 'Being built', built: 'Built', cant: "Can't", failed: 'The Box could not sort it' };
  function askHtml(a) {
    return `<li class="st-${a.status}"><strong>${esc(STATUS[a.status] || a.status)}:</strong> ${esc(a.ask)} <span class="meta">#${a.id}, ${esc(a.asked_by)} ${fmt(a.created_at)}</span>
      ${a.reason ? `<div class="meta">${esc(a.reason)}</div>` : ''}
      ${a.status === 'cant' && a.instead ? `<div>Instead: ${esc(a.instead)}</div>` : ''}
      ${a.status === 'building' && a.order_file ? `<div class="meta">Filed to the Box as ${esc(a.order_file)}</div>` : ''}
      ${a.status === 'declined' && a.note ? `<div class="meta">Mimi: ${esc(a.note)}</div>` : ''}
      ${a.status === 'failed' && a.note ? `<div class="meta">${esc(a.note)}</div>` : ''}
      ${a.proposed ? `<details><summary>The proposed new instructions</summary><pre class="proposed">${esc(a.proposed)}</pre></details>
        ${exec ? `<div class="row"><input type="text" data-f="dnote" placeholder="Note (optional)" aria-label="Note"><button class="btn ghost" data-a="apply" data-id="${a.id}">Apply</button><button class="btn ghost" data-a="decline" data-id="${a.id}">Decline</button></div>` : ''}` : ''}
    </li>`;
  }
  function characterHtml(a) {
    const c = a.character; const cur = a.current; const st = status(a); const run = a.last_run;
    const on = cur ? cur.enabled : true; const n = cur ? cur.max_cards : a.default_max_cards;
    const list = (xs, f) => xs.length ? `<ul>${xs.map(f).join('')}</ul>` : '<p class="meta">Nothing listed.</p>';
    return `<a class="back" href="#">← The whole team</a>
    <section class="hero" data-slug="${a.slug}">
      <div class="pic">${face(a, 190)}
        <label class="btn ghost up">Upload portrait<input type="file" accept="image/png,image/jpeg,image/webp" data-a="portrait" aria-label="Upload a portrait for ${esc(a.name)}"></label>
        ${a.portrait ? '<button class="btn ghost" data-a="noportrait" style="min-height:36px;font-size:13px">Use the drawn portrait</button>' : ''}
        <span class="meta" style="text-align:center">PNG, JPG or WebP. Square works best; it is resized here before saving.</span></div>
      <div class="info">
        <span class="role">${V.showEyebrow(c.role, a.name) ? `${esc(c.role)} · ` : ''}${esc(a.job)}</span>
        ${nameInput(a)}
        <span class="meta">${a.named_by ? `Named by ${esc(a.named_by)}. ` : ''}Rename any time; it saves at once. Clear the box to go back to "${esc(a.default_name)}".</span>
        <div class="row"><span class="pill ${st.cls}">${st.label}</span><span class="meta">${esc(a.cadence)}</span>
          <span class="meta">${run ? `Last run: ${esc(run.status)} ${fmt(run.started_at)}` : 'Has not run yet'}</span></div>
        ${a.ask_page ? `<div class="row"><a class="btn primary" href="${esc(a.ask_page)}">Ask ${esc(a.name)}</a></div>
        <p class="meta" style="margin:0">Asked on his own page; the Box answers there within 15 minutes.</p>` : a.card_only ? `<p class="meta" style="margin:0">${esc(a.card_only)}</p>` : `<div class="row"><input type="text" data-f="ask" placeholder="Optional request, e.g. a winter-wedding post for The Bell Tower" aria-label="Request for this run">
          <button class="btn primary" data-a="run" ${a.waiting ? 'disabled' : ''}>${a.waiting ? 'Run waiting' : 'Run now'}</button></div>
        <p class="meta" style="margin:0">The Box picks it up within 15 minutes; the draft lands in <a href="/review">Review</a>.</p>`}
        <p class="msg" hidden></p>
      </div>
    </section>
    <div class="panels" data-slug="${a.slug}">
      <section class="panel"><h2 class="serif">What ${esc(a.name)} does</h2>${list(c.does, (x) => `<li>${esc(x)}</li>`)}
        <details><summary>What it reads (${a.sources.length})</summary><ul>${a.sources.map((s) => `<li>${esc(s.label)}${s.required ? ' (required)' : ''}${s.pending ? ` <span class="pill s-wait">not connected</span> ${esc(s.why || '')}` : ''}</li>`).join('')}</ul>
        <p class="meta">Adding a source is a code change; ask Mimi.</p></details></section>
      <section class="panel"><h2 class="serif">Rules</h2>${c.traits.length ? c.traits.map((t) => `<div class="rule"><strong>Can't:</strong> ${esc(t.cant)}${t.instead ? `<div class="instead">Instead: ${esc(t.instead)}</div>` : ''}</div>`).join('') : '<p class="meta">Nothing listed.</p>'}</section>
      ${a.watch ? `<section class="panel" data-watch><h2 class="serif">Competitors to watch</h2>
        <p class="meta" style="margin:0">${esc(a.name)} reads up to a dozen public pages on each site every Monday and reports only what changed. The first week on a new site is a baseline. Up to 15 sites.</p>
        ${a.watch.length ? `<ul class="asks">${a.watch.map((w) => `<li style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><strong>${esc(w.label || w.site)}</strong>${w.label ? ` <span class="meta">${esc(w.site)}</span>` : ''}</span><button class="btn ghost" style="min-height:32px;font-size:13px" data-a="unwatch" data-id="${w.id}" aria-label="Stop watching ${esc(w.site)}">Remove</button></li>`).join('')}</ul>` : '<p class="meta">No competitors yet. Add the first one below.</p>'}
        <div class="row"><input type="text" data-f="wsite" placeholder="Website, e.g. example.com" aria-label="Competitor website">
          <input type="text" data-f="wlabel" placeholder="Name (optional)" aria-label="Competitor name"><button class="btn ghost" data-a="watch">Add</button></div></section>` : ''}
      <section class="panel"><h2 class="serif">Waiting on</h2>${list(c.needs, (x) => `<li>${esc(x)}</li>`)}</section>
      <section class="panel"><h2 class="serif">Ask for a new ability</h2>
        <label class="meta" for="newask">The Box sorts it within 15 minutes: an instruction change (Mimi approves it), a build (filed to the Box), or a can't (added to the rules, with what it does instead).</label>
        <textarea id="newask" data-f="newask" rows="3" placeholder="e.g. add a short FAQ to every post"></textarea>
        <div><button class="btn ghost" data-a="ask">Ask</button></div>
        ${a.asks.length ? `<details ${a.asks.some((x) => ['awaiting_exec', 'new', 'sorting'].includes(x.status)) ? 'open' : ''}><summary>Asked for (${a.asks.length})</summary><ul class="asks">${a.asks.map(askHtml).join('')}</ul></details>` : ''}</section>
    </div>
    <section class="panel" id="instr" data-slug="${a.slug}"><h2 class="serif">Instructions</h2>
      <p class="meta" style="margin:0">${cur ? `Version ${cur.version}, saved by ${esc(cur.edited_by)} ${fmt(cur.created_at)}${cur.note ? ' (' + esc(cur.note) + ')' : ''}` : 'Default instructions (never edited)'}. What no edit can change: drafts only, never published, posted, sent or spent, and every draft is checked for em dashes and AI tells.</p>
      <details><summary>Edit instructions and settings</summary>
        <textarea class="code" data-f="skill" aria-label="Instructions">${esc(cur ? cur.skill_md : a.default_skill)}</textarea>
        <div class="row">
          <label><input type="checkbox" data-f="enabled" ${on ? 'checked' : ''}> On (runs on its schedule)</label>
          <label>Drafts per run <select data-f="max">${[1, 2, 3, 4, 5, 6, 8, 10].map((x) => `<option ${x === n ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
          <input type="text" data-f="note" placeholder="What you changed (optional)" aria-label="Note">
          <button class="btn primary" data-a="save">Save as a new version</button><button class="btn ghost" data-a="default">Back to the default</button>
        </div></details>
      <details data-h><summary>History</summary><div class="tbl" data-f="hist"><p class="meta">Open to load.</p></div></details>
      <p class="msg" hidden></p></section>`;
  }

  function render() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const a = agents.find((x) => x.slug === slug);
    main.innerHTML = a ? characterHtml(a) : rosterHtml();
    document.title = a ? `${a.name} · Katherine's Team` : "Katherine's Team · Marketing";
  }
  async function load() {
    try { const j = await api('/api/agents'); agents = j.agents; exec = !!j.exec;
      try { producer = await api('/api/producer'); } catch (x) { producer = null; }
      try { voices = await api('/api/agent-voices'); } catch (x) { voices = { on: false }; }
      render(); }
    catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  }
  function say(from, text, ok) {
    const box = from.closest('[data-slug]') || main;
    const m = box.querySelector('.msg') || main.querySelector('.msg');
    if (!m) return; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; m.hidden = false;
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  // Names save on Enter or when the box loses focus. Esc puts it back.
  main.addEventListener('keydown', (e) => {
    const pn = e.target.closest('input[data-pname]');
    if (pn && e.key === 'Enter') { e.preventDefault(); pn.blur(); return; }
    const i = e.target.closest('input[data-name]'); if (!i) return;
    if (e.key === 'Enter') { e.preventDefault(); i.blur(); }
    if (e.key === 'Escape') { i.value = agents.find((x) => x.slug === i.dataset.name).name; i.blur(); }
  });
  main.addEventListener('change', async (e) => {
    const ms = e.target.closest('select[data-movesel]');
    if (ms) { await moveDay(ms.dataset.movesel, ms.dataset.from, ms.value, ms); return; }
    const pn = e.target.closest('input[data-pname]');
    if (pn) {
      try { const r = await api('/api/producer/name', { method: 'POST', body: JSON.stringify({ name: pn.value }) });
        producer.name = r.name; pn.value = r.name; syncEyebrow('producer', r.name); say(pn, `Saved. Now "${r.name}".`, true); }
      catch (x) { pn.value = producer.name; say(pn, x.message); }
      return;
    }
    const i = e.target.closest('input[data-name]');
    if (i) {
      const a = agents.find((x) => x.slug === i.dataset.name);
      try { const r = await api(`/api/agents/${a.slug}/name`, { method: 'POST', body: JSON.stringify({ name: i.value }) });
        a.name = r.name; a.named_by = r.profile && r.profile.display_name ? r.profile.updated_by : null; i.value = r.name; syncEyebrow(a.slug, r.name); say(i, `Saved. Now "${r.name}" everywhere.`, true); }
      catch (x) { i.value = a.name; say(i, x.message); }
      return;
    }
    const f = e.target.closest('input[data-a=portrait]');
    if (f && f.files && f.files[0]) {
      const a = agents.find((x) => x.slug === f.closest('[data-slug]').dataset.slug);
      try { say(f, 'Saving the portrait…', true); const blob = await squareImage(f.files[0]);
        const r = await fetch(`/api/agents/${a.slug}/portrait`, { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': blob.type }, body: blob });
        const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('error ' + r.status));
        await load(); say(main.querySelector('.hero') || main, 'Portrait saved.', true); }
      catch (x) { say(f, x.message || 'Could not read that picture.'); }
    }
  });
  // Crop to a centered square and shrink to 512px so any ChatGPT/Canva export fits.
  function squareImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        const s = Math.min(img.naturalWidth, img.naturalHeight); const out = Math.min(512, s);
        const c = document.createElement('canvas'); c.width = out; c.height = out;
        c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, out, out);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('Could not read that picture.'))), 'image/jpeg', 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a picture this browser can open.')); };
      img.src = url;
    });
  }
  main.addEventListener('toggle', async (e) => {
    const d = e.target; if (!d.matches || !d.matches('details[data-h]') || !d.open) return;
    const slug = d.closest('[data-slug]').dataset.slug;
    try {
      const [{ versions }, { changes }] = await Promise.all([api(`/api/agents/${slug}/history`), api(`/api/agents/${slug}/profile-log`)]);
      const rows = [
        ...versions.map((v) => ({ at: v.created_at, by: v.edited_by, what: `Instructions v${v.version}${v.enabled ? '' : ' (paused)'}, ${v.max_cards} drafts per run${v.note ? ': ' + v.note : ''}`, v: v.version })),
        ...changes.map((c) => ({ at: c.changed_at, by: c.changed_by, what: c.field === 'name' ? `Renamed${c.old_value ? ` from "${c.old_value}"` : ''} to "${c.new_value || 'the default name'}"` : (c.new_value === 'removed' ? 'Portrait removed' : 'New portrait') })),
      ].sort((x, y) => new Date(y.at) - new Date(x.at));
      d.querySelector('[data-f=hist]').innerHTML = rows.length ? `<table class="hist"><tr><th>When</th><th>Who</th><th>What</th><th></th></tr>${rows.map((r) => `<tr><td>${fmt(r.at)}</td><td>${esc(r.by)}</td><td>${esc(r.what)}</td><td>${r.v ? `<button class="btn ghost" style="min-height:32px" data-a="revert" data-v="${r.v}">Put back</button>` : ''}</td></tr>`).join('')}</table>` : '<p class="meta">Never changed; it runs the default instructions.</p>';
    } catch (x) { say(d, x.message); }
  }, true);
  main.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const box = b.closest('[data-slug]'); const slug = box.dataset.slug; const a = agents.find((x) => x.slug === slug);
    const q = (f) => main.querySelector(`[data-f=${f}]`);
    try {
      if (b.dataset.a === 'run') { b.disabled = true; await api(`/api/agents/${slug}/run`, { method: 'POST', body: JSON.stringify({ ask: q('ask') ? q('ask').value : '' }) }); a.waiting = 1; b.textContent = 'Run waiting'; say(b, 'Queued. The draft will be in Review within about 15 minutes.', true); }
      if (b.dataset.a === 'watch') { await api(`/api/agents/${slug}/watch`, { method: 'POST', body: JSON.stringify({ site: q('wsite').value, label: q('wlabel').value }) }); await load(); say(main.querySelector('.panels'), 'Added. It is read next Monday (first week is a baseline).', true); }
      if (b.dataset.a === 'unwatch') { await api(`/api/agents/${slug}/watch/${b.dataset.id}`, { method: 'DELETE' }); await load(); }
      if (b.dataset.a === 'noportrait') { await api(`/api/agents/${slug}/portrait`, { method: 'DELETE' }); await load(); }
      if (b.dataset.a === 'ask') { await api(`/api/agents/${slug}/asks`, { method: 'POST', body: JSON.stringify({ ask: q('newask').value }) }); await load(); say(main.querySelector('.panels'), 'Asked. The Box sorts it within about 15 minutes.', true); }
      if (b.dataset.a === 'apply' || b.dataset.a === 'decline') { const li = b.closest('li'); await api(`/api/agents/asks/${b.dataset.id}/decide`, { method: 'POST', body: JSON.stringify({ decision: b.dataset.a, note: (li.querySelector('[data-f=dnote]') || {}).value }) }); await load(); }
      if (b.dataset.a === 'save') { const r = await api(`/api/agents/${slug}`, { method: 'POST', body: JSON.stringify({ skill_md: q('skill').value, enabled: q('enabled').checked, max_cards: Number(q('max').value), note: q('note').value }) }); await load(); say(main.querySelector('#instr'), `Saved as version ${r.settings.version}. The next run uses it.`, true); }
      if (b.dataset.a === 'default') { q('skill').value = a.default_skill; say(b, 'Default text loaded. Press Save to make it the new version.', true); }
      if (b.dataset.a === 'revert') { const r = await api(`/api/agents/${slug}/revert`, { method: 'POST', body: JSON.stringify({ version: Number(b.dataset.v) }) }); await load(); say(main.querySelector('#instr'), `Put back as version ${r.settings.version}.`, true); }
    } catch (x) { b.disabled = false; say(b, x.message); }
  });
  load();
})();
</script>
<script src="https://dispatch.infinityhospitalitygroup.com/ihg-nav.js" defer></script>
