<title>Fleet API Keys: Marketing Dashboard</title><!-- ORDER #654 Amendment B: the estate's design system (#286), loaded BEFORE
     this page's own styles so its tokens are available and the chrome reads as
     one system, while every existing rule below still wins. This is chrome
     consistency, NOT a redesign -- the dashboard's content, charts, the Elle
     GA4 tab and every live number are untouched, per the amendment's rule 5.
     The shared nav (ihg-nav.js) was ALREADY present on this page; measured, not
     assumed, so it is not re-applied. -->
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg.css">
<link rel="stylesheet" href="https://dispatch.infinityhospitalitygroup.com/ihg-tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ORDER #1675: on the approved tokens (#1210), same selectors. */
body{font-family:var(--ihg-font-ui);font-size:var(--ihg-text-sm);line-height:var(--ihg-line-height-body);color:var(--ihg-color-text);background:var(--ihg-color-bg);margin:0;padding:var(--ihg-space-8) var(--ihg-space-5)}
.wrap{max-width:760px;margin:0 auto}h1{font-size:var(--ihg-text-2xl);letter-spacing:var(--ihg-tracking-heading);margin:0 0 var(--ihg-space-1)}p.sub{color:var(--ihg-color-text-secondary);margin:0 0 var(--ihg-space-6)}
.card{background:var(--ihg-color-surface);border:1px solid var(--ihg-color-border);border-radius:var(--ihg-radius);box-shadow:var(--ihg-shadow-card);padding:var(--ihg-space-5) var(--ihg-space-6);margin-bottom:var(--ihg-space-4)}
label{display:block;font-size:var(--ihg-text-xs);font-weight:var(--ihg-weight-semibold);color:var(--ihg-color-text-secondary);margin-bottom:var(--ihg-space-1)}
input{width:100%;min-height:var(--ihg-target-min);padding:0 var(--ihg-space-3);border:1px solid var(--ihg-color-border-control);border-radius:var(--ihg-radius);font:inherit;box-sizing:border-box}
button{background:var(--ihg-color-inverse-bg);color:var(--ihg-color-inverse-text);border:0;border-radius:var(--ihg-radius);min-height:var(--ihg-target-min);padding:0 var(--ihg-space-4);font:inherit;font-weight:var(--ihg-weight-semibold);cursor:pointer}
button.mint{background:var(--ihg-color-action-bg);color:var(--ihg-color-action-text)}button.mint:hover{background:var(--ihg-color-action-hover)}button.link{background:none;color:var(--ihg-color-accent-text);min-height:0;padding:var(--ihg-space-1) var(--ihg-space-2)}
:focus-visible{outline:var(--ihg-focus-width) solid var(--ihg-color-focus);outline-offset:var(--ihg-focus-offset)}
.row{display:flex;gap:var(--ihg-space-3);align-items:flex-end}.row .grow{flex:1}
table{width:100%;border-collapse:collapse;margin-top:var(--ihg-space-2)}th,td{text-align:left;padding:var(--ihg-space-2);border-bottom:1px solid var(--ihg-color-border);font-size:var(--ihg-text-sm)}
th{color:var(--ihg-color-text-secondary);font-size:var(--ihg-text-xs);text-transform:uppercase;letter-spacing:var(--ihg-tracking-label)}code{font-family:var(--ihg-font-mono);background:var(--ihg-color-surface-muted);padding:2px 6px;border-radius:var(--ihg-radius-sm);font-size:.85em;word-break:break-all}
.reveal{background:var(--ihg-status-attention-bg);border:1px solid var(--ihg-status-attention-mark);border-radius:var(--ihg-radius);padding:var(--ihg-space-4);margin-top:var(--ihg-space-4)}
.reveal code{display:block;background:var(--ihg-color-surface);border:1px dashed var(--ihg-status-attention-mark);padding:var(--ihg-space-3);margin-top:var(--ihg-space-2)}
.revoked{color:var(--ihg-color-text-muted);text-decoration:line-through}.hint{color:var(--ihg-color-text-muted)}.err{color:var(--ihg-status-late-fg);font-size:var(--ihg-text-sm);margin-top:var(--ihg-space-2)}
</style></head><body><div class="wrap">
<h1>Fleet API keys</h1><p class="sub">Read-only keys other Infinity apps (like ARC) use to read website-traffic numbers. A key cannot read spend or cost figures. A key can only read, never change anything, and you can revoke it anytime.</p>
<!-- ORDER #1370: no password card. This page is behind the page gate, so the
     person here already signed in through Infinity and is exec or Katherine;
     the cookie session rides on every fetch below. -->
<div id="app">
 <div class="card"><div class="row"><div class="grow"><label for="label">Name this key</label><input id="label" placeholder="e.g. ARC read key"></div><button class="mint" id="mintBtn">Mint read-only key</button></div><div id="reveal" class="reveal" hidden><strong>Copy this now: it will never be shown again.</strong><code id="rawTok"></code></div><div id="mintErr" class="err"></div></div>
 <div class="card"><table><thead><tr><th>Key</th><th>Name</th><th>Last used</th><th></th></tr></thead><tbody id="list"><tr><td colspan="4" class="hint">Loading…</td></tr></tbody></table></div>
</div></div>
<script>
var $=function(i){return document.getElementById(i)};
function H(){return {'Content-Type':'application/json'}}
function fmt(t){if(!t)return'-';try{return new Date(t).toLocaleString()}catch(e){return t}}
function render(rows){var tb=$('list');if(!rows.length){tb.innerHTML='<tr><td colspan="4" class="hint">No keys yet.</td></tr>';return}tb.innerHTML=rows.map(function(r){var rev=!!r.revoked_at;var a=rev?'<span class="hint">revoked</span>':'<button class="link" data-id="'+r.id+'">Revoke</button>';return '<tr'+(rev?' class="revoked"':'')+'><td><code>'+r.token_prefix+'</code></td><td>'+(r.label||'(unnamed)')+'</td><td>'+fmt(r.last_used_at)+'</td><td>'+a+'</td></tr>'}).join('');Array.prototype.forEach.call(tb.querySelectorAll('button[data-id]'),function(b){b.onclick=function(){revoke(b.getAttribute('data-id'))}})}
function load(){fetch('/api/tokens',{headers:H()}).then(function(r){return r.json()}).then(function(x){if(Array.isArray(x))render(x);else $('list').innerHTML='<tr><td colspan="4" class="hint">'+(x.error||'')+'</td></tr>'}).catch(function(){})}
function mint(){fetch('/api/tokens',{method:'POST',headers:H(),body:JSON.stringify({label:$('label').value||''})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(x){if(x.ok&&x.d.token){$('rawTok').textContent=x.d.token;$('reveal').hidden=false;$('label').value='';load()}else{$('mintErr').textContent=x.d.error||'Mint failed'}}).catch(function(){})}
function revoke(id){fetch('/api/tokens/'+id+'/revoke',{method:'POST',headers:H()}).then(function(){load()}).catch(function(){})}
$('mintBtn').onclick=mint;load();
</script><script src="https://dispatch.infinityhospitalitygroup.com/ihg-nav.js" defer></script></body></html>
